name: Build & Release Portable EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run AST, UTF-8 BOM, ASCII Purity & PSScriptAnalyzer Checks
        shell: powershell
        run: |
          $path = 'retro-console-manager.ps1'
          $txt = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($txt, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if (-not ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) {
              Write-Error 'Missing UTF-8 BOM!'
              exit 1
          }
          $nonAscii = [regex]::Matches($txt, '[^\x00-\x7F]').Count
          if ($nonAscii -gt 0) {
              Write-Error "Detected $nonAscii non-ASCII characters!"
              exit 1
          }
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          $lintErrors = Invoke-ScriptAnalyzer -Path $path -Severity Error
          if ($lintErrors) {
              $lintErrors | Format-Table -AutoSize
              exit 1
          }
          Write-Host 'AST, UTF-8 BOM, Pure ASCII & PSScriptAnalyzer Passed.'

      - name: Compile Portable EXE with Pinned PS2EXE
        shell: powershell
        run: |
          Install-Module -Name ps2exe -RequiredVersion 1.0.15 -Force -Scope CurrentUser
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $ver = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { "$($Matches[1]).0" } else { '1.0.0.0' }
          Invoke-ps2exe -InputFile 'retro-console-manager.ps1' `
                        -OutputFile 'dist\RetroConsoleManager-Portable.exe' `
                        -NoConsole -STA `
                        -Title 'Retro Console Manager' `
                        -Product 'Retro Console Manager (PS1 & PS2)' `
                        -Version $ver
          Copy-Item 'games_catalog.json' -Destination 'dist\games_catalog.json'
          Copy-Item 'README.md' -Destination 'dist\README.md'
          Copy-Item 'LICENSE' -Destination 'dist\LICENSE'
          Copy-Item 'THIRD_PARTY_NOTICES.md' -Destination 'dist\THIRD_PARTY_NOTICES.md'
          Compress-Archive -Path 'dist\*' -DestinationPath 'RetroConsoleManager-Portable-x64.zip' -Force

      - name: Attach Portable Bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RetroConsoleManager-Portable-x64.zip
          generate_release_notes: true
